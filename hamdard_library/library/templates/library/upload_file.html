{% extends "library/base.html" %}

{% block title %}Upload | Library{% endblock %}

{% block content %}

<div class="row justify-content-center mt-4">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">

        <h2 class="text-center mb-4">Upload File</h2>

        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}

          <!-- File Title -->
          <div class="form-group">
            <label for="id_file_name">File Title</label>
            <input type="text"
                   name="file_name"
                   id="id_file_name"
                   class="form-control"
                   value="{{ form.file_name.value|stringformat:'s' }}"
                   required>
          </div>

          <!-- File Upload -->
          <div class="form-group">
            <label for="id_file_path">File (PDF only)</label>
            <input type="file"
                   name="file_path"
                   id="id_file_path"
                   accept="application/pdf"
                   class="form-control-file"
                   required>
          </div>

          <!-- Department -->
          <div class="form-group">
            <label for="id_file_department">Department</label>
            <select name="file_department"
                    id="id_file_department"
                    class="form-control"
                    required>
              {% for code, name in departments %}
                <option value="{{ code }}"
                  {% if form.file_department.value == code %}selected{% endif %}>
                  {{ name }}
                </option>
              {% endfor %}
            </select>
          </div>

          <!-- Semester -->
          <div class="form-group">
            <label for="id_semester">Semester</label>
            <select name="semester"
                    id="id_semester"
                    class="form-control"
                    required>
              {% for i in semesters %}
                <option value="{{ i }}"
                  {% if form.semester.value == i|stringformat:"s" %}selected{% endif %}>
                  {{ i }}
                </option>
              {% endfor %}
            </select>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-dark btn-block mt-3">
            Upload
          </button>

        </form>

      </div>
    </div>
  </div>
</div>

{% endblock %}
